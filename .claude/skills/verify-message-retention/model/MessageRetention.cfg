\* scripts/check.sh runs this (SKILL.md, bounds). Two sessions and two texts
\* let a fork name another session's history and a text be shared; the clock
\* reaches a message past its grace and a finished tree past KeepFinished.
CONSTANT Sessions = {A, B}
CONSTANT Texts = {t1, t2}
CONSTANT MaxTurns = 2
CONSTANT Grace = 2
CONSTANT Keep = 1
CONSTANT MaxTime = 3
\* The known findings (SKILL.md), off here; check.sh -set NAME=TRUE turns one on.
CONSTANT RemoveDuringFork = FALSE
CONSTANT ForkFailed = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS TypeOK NothingReachedIsLost
