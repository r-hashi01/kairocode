# A release from a tag (docs/release.md): v0.1.0 pushed, the check passes
# on macOS and Linux, then the binaries (macOS and Linux, amd64 and arm64),
# their checksums and the Homebrew formula go to a draft release, to be
# looked at and published by hand.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: scripts/release-build.sh "$GITHUB_REF_NAME" dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
