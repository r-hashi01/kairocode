# The definition of done (AGENTS.md), on macOS and Linux: scripts/check.sh
# (gofmt, vet, build, all tests with -race including the crash tests, the
# invariants, the ADRs).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # a release is made only once it passes (release.yml)

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Named by the system, not its version: the ruleset of main requires
    # "check (linux)" and "check (macos)", which a newer runner keeps.
    name: check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            os: ubuntu-26.04
          - system: macos
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The Linux sandbox (bubblewrap, user namespaces)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu (24.04 and later) lets AppArmor refuse unprivileged user
          # namespaces, which bubblewrap needs (ADR 0005).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: git identity for the tests that commit
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: scripts/check.sh
